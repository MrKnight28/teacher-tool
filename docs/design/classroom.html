<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Classroom</title>
<style>
:root{
  --bg:#0f1419; --panel:#171e26; --panel2:#1d2630; --line:#2a3542; --text:#e6edf3; --muted:#8b98a7;
  --accent:#4cc9a6; --accent2:#f2b84b; --danger:#ef6b6b; --paper:#fbf7ec; --ink:#2b2a27; --rule:#d9d2bd;
  --nb-w:40%;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px}
.brand span{color:var(--accent)}
.lesson-title{color:var(--muted);flex:1;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--text)}
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 10px var(--nb-w);min-height:0;padding:12px 12px 12px 12px;gap:0}
.classroom{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}

/* stepper */
.stepper{display:flex;gap:6px}
.step{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted);text-align:left;position:relative;overflow:hidden}
.step b{display:block;color:var(--text);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{opacity:.6}
.step.done::after{content:"✓";position:absolute;right:8px;top:6px;color:var(--accent)}
.step.active{border-color:var(--accent);background:#14262a}

/* teacher screen */
.screen{flex:1;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.screen-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}
.avatar{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7be8c9,#2a8f77);box-shadow:0 0 0 0 rgba(76,201,166,.5);flex:none}
.avatar.speaking{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,201,166,.55)}100%{box-shadow:0 0 0 14px rgba(76,201,166,0)}}
.who b{display:block;line-height:1.2}
.who small{color:var(--muted)}
.state{margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.state.speaking{color:var(--accent);border-color:var(--accent)}
.state.thinking{color:var(--accent2);border-color:var(--accent2)}
.timer{font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;min-width:64px;text-align:right}
.timer.over{color:var(--accent2)}
.board{flex:1;min-height:0;overflow:auto;padding:24px 32px;background:
  linear-gradient(180deg,#121a21,#0e151b)}
.board h2{margin:0 0 4px;font-size:28px}
.board .kicker{color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:12px}
.board p,.board li{font-size:18px;color:#cfd8e1}
.board table{border-collapse:collapse;width:100%;margin-top:12px;font-size:16px}
.board th,.board td{border:1px solid var(--line);padding:8px 12px;text-align:left}
.board th{background:var(--panel2);color:var(--accent2)}
.board .callout{margin-top:16px;padding:12px 16px;border-left:4px solid var(--accent2);background:#221f12;border-radius:6px}
.nudge{display:none;margin:0 16px 10px;padding:8px 12px;border-radius:8px;background:#2a2410;border:1px solid var(--accent2);color:#f6dca0;font-size:14px}
.nudge.show{display:block}
.caption{padding:10px 18px;background:#0b1015;border-top:1px solid var(--line);min-height:56px;color:#dbe4ec;font-size:16px}
.caption::before{content:"Teacher: ";color:var(--accent);font-weight:600}
.controls{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:#40505f}
.btn.primary{background:var(--accent);color:#04201a;border-color:var(--accent);font-weight:600}
.btn.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.spacer{flex:1}
.ask{display:flex;gap:8px;flex:1;min-width:200px}
.ask input{flex:1;background:#0b1015;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font:inherit}

/* splitter */
.splitter{cursor:col-resize;position:relative}
.splitter::after{content:"";position:absolute;left:4px;top:50%;height:48px;width:3px;margin-top:-24px;border-radius:2px;background:var(--line)}
.splitter:hover::after{background:var(--accent)}

/* notebook */
.notebook{display:flex;min-width:0;min-height:0;position:relative}
.page{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border-radius:10px 0 0 10px;box-shadow:0 8px 30px rgba(0,0,0,.4);position:relative;overflow:hidden}
.page::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#e3a0a0;opacity:.7;z-index:1}
.holes{position:absolute;left:9px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;padding:40px 0;z-index:2;pointer-events:none}
.holes i{width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.nb-tools{display:flex;gap:6px;padding:8px 10px 6px 46px;border-bottom:1px solid var(--rule);flex-wrap:wrap;align-items:center;position:relative;z-index:2}
.nb-tools button{background:#efe8d3;border:1px solid var(--rule);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--ink)}
.nb-tools button:hover{background:#e6dcc0}
.nb-tools input{flex:1;min-width:90px;border:1px solid var(--rule);border-radius:6px;padding:3px 8px;font-size:12.5px;background:#fffdf6;color:var(--ink)}
.note-title{border:0;background:transparent;font:700 22px/1.3 Georgia,"Times New Roman",serif;color:var(--ink);padding:10px 14px 4px 46px;outline:none;width:100%;position:relative;z-index:2}
.note-body{flex:1;border:0;outline:none;resize:none;background:
  repeating-linear-gradient(transparent,transparent 27px,var(--rule) 27px,var(--rule) 28px);
  background-attachment:local;
  font:17px/28px "Segoe Print","Bradley Hand","Comic Sans MS",Georgia,serif;color:var(--ink);padding:2px 16px 8px 46px;width:100%;position:relative;z-index:2}
.nb-foot{display:flex;justify-content:space-between;padding:5px 14px 6px 46px;font-size:12px;color:#7a755f;border-top:1px solid var(--rule);position:relative;z-index:2}
.tabs{display:flex;flex-direction:column;gap:3px;padding-top:18px;overflow-y:auto;overflow-x:hidden;width:34px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{width:34px;min-height:96px;max-height:150px;border:0;border-radius:0 8px 8px 0;writing-mode:vertical-rl;transform:rotate(180deg);
  padding:10px 4px;font-size:12.5px;font-weight:600;color:#2b2a27;text-align:left;box-shadow:2px 2px 6px rgba(0,0,0,.3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:width .12s}
.tab{border-radius:8px 0 0 8px}
.tab:hover{width:40px;margin-left:-6px}
.tab.active{width:42px;margin-left:-8px;filter:brightness(1.08)}
.tab.add{background:#2a3542;color:var(--text);min-height:44px;writing-mode:horizontal-tb;transform:none;font-size:18px;padding:0;border-radius:0 8px 8px 0;text-align:center}
.tab.hidden{display:none}
.empty{padding:30px 46px;color:#7a755f}

@media (max-width:900px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;grid-auto-rows:auto;gap:10px}
  .splitter{display:none}
  .screen{min-height:520px}
  .notebook{height:560px}
  .stepper{overflow-x:auto}
  .step{min-width:110px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">Tutor<span>Room</span></div>
  <div class="lesson-title" id="lessonTitle">Security+ SY0-701 · Domain 2 · Threat actors & motivations</div>
  <div class="chip">Exam in <b id="examDays">–</b> days</div>
  <div class="chip" id="clock">–</div>
</header>

<div class="layout" id="layout">
  <section class="classroom">
    <div class="stepper" id="stepper"></div>

    <div class="screen">
      <div class="screen-head">
        <div class="avatar" id="avatar"></div>
        <div class="who"><b>Your tutor</b><small id="stageLabel">Stage</small></div>
        <span class="state" id="state">Listening</span>
        <div class="timer" id="timer">00:00</div>
      </div>

      <div class="board" id="board"></div>
      <div class="nudge" id="nudge">Time is up for this stage. Carry on if you need to, or hit Next when you're ready.</div>
      <div class="caption" id="caption"></div>

      <div class="controls">
        <button class="btn" id="mic" title="Hold to talk (voice not wired yet)">🎙 Talk</button>
        <button class="btn" id="pause">⏸ Pause</button>
        <button class="btn" id="replay">↺ Repeat</button>
        <form class="ask" id="askForm">
          <input id="askInput" placeholder="Type a question for the tutor…" autocomplete="off">
          <button class="btn">Ask</button>
        </form>
        <span class="spacer"></span>
        <button class="btn" id="prev">← Back</button>
        <button class="btn primary" id="next">Next stage →</button>
      </div>
    </div>
  </section>

  <div class="splitter" id="splitter" title="Drag to resize"></div>

  <aside class="notebook">
    <div class="page">
      <div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="nb-tools">
        <button id="newNote">+ Note</button>
        <button id="stamp" title="Insert stage + time">⏱ Stamp</button>
        <button id="check" title="Insert checkbox line">☐ Item</button>
        <input id="search" placeholder="Search all notes…">
        <button id="export" title="Download all notes as Markdown">⬇ Export</button>
        <button id="del" title="Delete this note">🗑</button>
      </div>
      <input class="note-title" id="noteTitle" placeholder="Untitled note">
      <textarea class="note-body" id="noteBody" placeholder="Write notes here…" spellcheck="true"></textarea>
      <div class="nb-foot"><span id="wc">0 words</span><span id="saved">Saved</span></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </aside>
</div>

<script>
/* =====================================================================
   Integration hooks (for wiring to the Tutor API later):
     Classroom.loadLesson({title, stages:[{name, mins, html, say}]})
     Classroom.say(text)            -> caption + speaking state
     Classroom.setState('listening'|'speaking'|'thinking')
     Classroom.onAsk = (question)=>{}   // called when the student types a question
   Everything below the DEMO marker is placeholder content.
   ===================================================================== */
const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- DEMO lesson ---------- */
let lesson = {
  title:"Security+ SY0-701 · Domain 2 · Threat actors & motivations",
  stages:[
    {name:"Retrieval", mins:5, html:`<div class="kicker">Warm-up</div><h2>What do you remember?</h2>
      <p>Without looking at your notes:</p><ol><li>What do the letters C, I and A stand for?</li><li>Name one preventive and one detective control.</li><li>What is the difference between a vulnerability and a threat?</li></ol>`,
      say:"Let's start with retrieval. No notes yet. Answer out loud, or type your answers to me."},
    {name:"Intro", mins:5, html:`<div class="kicker">Today</div><h2>Threat actors & motivations</h2>
      <p>By the end of this lesson you can match an actor to its attributes and motivation in a scenario question.</p>
      <div class="callout">Exam tip: scenario questions describe behaviour, then ask who or why.</div>`,
      say:"Today's goal is simple: read a scenario and name the likely actor and motive."},
    {name:"Teaching", mins:15, html:`<div class="kicker">Core idea</div><h2>Actors compared</h2>
      <table><tr><th>Actor</th><th>Resources</th><th>Typical motive</th></tr>
      <tr><td>Nation-state</td><td>Very high</td><td>Espionage, disruption</td></tr>
      <tr><td>Organised crime</td><td>High</td><td>Financial gain</td></tr>
      <tr><td>Hacktivist</td><td>Low–medium</td><td>Ideology</td></tr>
      <tr><td>Insider</td><td>Varies (has access)</td><td>Revenge, profit, error</td></tr>
      <tr><td>Unskilled attacker</td><td>Low</td><td>Curiosity, notoriety</td></tr></table>`,
      say:"Look at the table. Notice that insiders are the only row defined by access, not by skill."},
    {name:"Guided practice", mins:10, html:`<div class="kicker">Together</div><h2>Scenario 1</h2>
      <p>A disgruntled employee copies customer records to a USB drive the day before resigning.</p>
      <p><b>Which actor? Which motive?</b> Say your reasoning before you answer.</p>`,
      say:"Talk me through it. What's the first detail that points to the actor?"},
    {name:"Independent", mins:15, html:`<div class="kicker">On your own</div><h2>Scenarios 2–5</h2>
      <p>Work through each in your notebook. Write the actor, the motive, and one control that would have helped.</p>`,
      say:"I'll stay quiet while you work. Ask if you get stuck."},
    {name:"Q&A", mins:5, html:`<div class="kicker">Your turn</div><h2>Questions</h2><p>Anything unclear? Ask now, or flag it in your notes for tomorrow.</p>`,
      say:"What's the one thing you're least sure about?"},
    {name:"Review", mins:5, html:`<div class="kicker">Wrap-up</div><h2>Key takeaways</h2>
      <ul><li>Actor = who, capability, resources</li><li>Motivation = why</li><li>Insiders are defined by access</li></ul>
      <p>Write a three-line summary in your notebook before you finish.</p>`,
      say:"Summarise today in three lines. That's what goes into tomorrow's retrieval."}
  ]
};

/* ---------- Classroom engine ---------- */
const Classroom = {
  idx:0, remaining:0, running:true, typing:null, onAsk:null,
  loadLesson(l){lesson=l;this.idx=0;$('#lessonTitle').textContent=l.title;buildStepper();this.go(0)},
  go(i){
    this.idx=Math.max(0,Math.min(lesson.stages.length-1,i));
    const s=lesson.stages[this.idx];
    this.remaining=s.mins*60;
    $('#board').innerHTML=s.html;
    $('#stageLabel').textContent=`Stage ${this.idx+1} of ${lesson.stages.length} · ${s.name}`;
    $('#nudge').classList.remove('show');
    $('#next').textContent=this.idx===lesson.stages.length-1?'Finish lesson ✓':'Next stage →';
    document.querySelectorAll('.step').forEach((el,n)=>{
      el.classList.toggle('active',n===this.idx);el.classList.toggle('done',n<this.idx)});
    this.say(s.say);renderTimer();
  },
  say(text){
    clearInterval(this.typing);
    const cap=$('#caption');let n=0;cap.textContent=' ';
    this.setState('speaking');
    this.typing=setInterval(()=>{
      n+=2;cap.textContent=text.slice(0,n);
      if(n>=text.length){clearInterval(this.typing);this.setState('listening')}
    },28);
  },
  setState(s){
    const el=$('#state');el.className='state '+s;
    el.textContent=s[0].toUpperCase()+s.slice(1);
    $('#avatar').classList.toggle('speaking',s==='speaking');
  }
};
window.Classroom=Classroom;

function fmt(sec){const a=Math.abs(sec),m=String(Math.floor(a/60)).padStart(2,'0'),s=String(a%60).padStart(2,'0');return (sec<0?'+':'')+m+':'+s}
function renderTimer(){
  const t=$('#timer');t.textContent=fmt(Classroom.remaining);t.classList.toggle('over',Classroom.remaining<0);
}
setInterval(()=>{
  if(!Classroom.running)return;
  Classroom.remaining--;renderTimer();
  if(Classroom.remaining===-1) $('#nudge').classList.add('show');   // gentle prompt, no auto-skip
},1000);

function buildStepper(){
  $('#stepper').innerHTML=lesson.stages.map((s,i)=>`<button class="step" data-i="${i}"><b>${s.name}</b>${s.mins} min</button>`).join('');
  document.querySelectorAll('.step').forEach(b=>b.onclick=()=>Classroom.go(+b.dataset.i));
}
buildStepper();

$('#next').onclick=()=>{ if(Classroom.idx===lesson.stages.length-1){Classroom.say("Well done. Make sure your summary note is saved. See you next lesson.");document.querySelectorAll('.step').forEach(e=>e.classList.add('done'));Classroom.running=false}else Classroom.go(Classroom.idx+1)};
$('#prev').onclick=()=>Classroom.go(Classroom.idx-1);
$('#replay').onclick=()=>Classroom.say(lesson.stages[Classroom.idx].say);
$('#pause').onclick=function(){Classroom.running=!Classroom.running;this.textContent=Classroom.running?'⏸ Pause':'▶ Resume'};
$('#mic').onclick=function(){
  const on=this.classList.toggle('rec');
  this.textContent=on?'● Listening…':'🎙 Talk';
  Classroom.setState(on?'listening':'listening');
  if(on) $('#caption').textContent='(Voice is not connected yet. Type your question below.)';
};
$('#askForm').onsubmit=e=>{
  e.preventDefault();const q=$('#askInput').value.trim();if(!q)return;
  $('#askInput').value='';
  if(typeof Classroom.onAsk==='function'){Classroom.setState('thinking');Classroom.onAsk(q)}
  else{Classroom.setState('thinking');setTimeout(()=>Classroom.say(`Good question: "${q}". (Demo mode: the tutor API isn't connected, so I can't answer yet. Add it to your notes.)`),700)}
};

/* ---------- Header ---------- */
function tick(){
  const now=new Date();
  $('#clock').textContent=now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' · '+now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  const exam=new Date('2027-06-30T00:00:00');
  $('#examDays').textContent=Math.max(0,Math.ceil((exam-now)/864e5));
}
tick();setInterval(tick,30000);

/* ---------- Notebook ---------- */
const COLORS=['#f2b84b','#4cc9a6','#7fb4f5','#e98a8a','#c3a1ef','#f0a56b','#9ad66f','#6fd0d6'];
const seed=[
  {id:'n-today',title:'Today',body:'Lesson notes go here.\n\n☐ Finish scenarios 2–5\n☐ Write 3-line summary'},
  {id:'n-d1',title:'1 · General Security',body:''},
  {id:'n-d2',title:'2 · Threats & Mitigations',body:'Threat actors:\n- Nation-state\n- Organised crime\n- Hacktivist\n- Insider\n- Unskilled attacker'},
  {id:'n-d3',title:'3 · Security Architecture',body:''},
  {id:'n-d4',title:'4 · Security Operations',body:''},
  {id:'n-d5',title:'5 · Program Mgmt & Oversight',body:''},
  {id:'n-acr',title:'Acronyms',body:''}
];
let notes=store.get('classroom.notes',seed);
let activeId=store.get('classroom.active',notes[0]?.id);
let saveTimer=null;

const uid=()=>'n-'+Math.random().toString(36).slice(2,9);
const current=()=>notes.find(n=>n.id===activeId);
function persist(){store.set('classroom.notes',notes);store.set('classroom.active',activeId);$('#saved').textContent='Saved'}

function renderTabs(){
  const q=$('#search').value.trim().toLowerCase();
  $('#tabs').innerHTML=notes.map((n,i)=>{
    const hit=!q||(n.title+' '+n.body).toLowerCase().includes(q);
    return `<button class="tab ${n.id===activeId?'active':''} ${hit?'':'hidden'}" data-id="${n.id}" style="background:${COLORS[i%COLORS.length]}" title="${esc(n.title||'Untitled')}">${esc(n.title||'Untitled')}</button>`;
  }).join('')+`<button class="tab add" id="addTab" title="New note">+</button>`;
  document.querySelectorAll('.tab[data-id]').forEach(b=>b.onclick=()=>{flush();activeId=b.dataset.id;renderNote();renderTabs();persist()});
  $('#addTab').onclick=newNote;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderNote(){
  const n=current();
  const has=!!n;
  $('#noteTitle').disabled=$('#noteBody').disabled=!has;
  $('#noteTitle').value=n?n.title:'';$('#noteBody').value=n?n.body:'';
  updateWc();
}
function updateWc(){const t=$('#noteBody').value.trim();$('#wc').textContent=(t?t.split(/\s+/).length:0)+' words'}
function flush(){clearTimeout(saveTimer);const n=current();if(!n)return;n.title=$('#noteTitle').value;n.body=$('#noteBody').value;persist()}
function queueSave(){
  const n=current();if(!n)return;
  n.title=$('#noteTitle').value;n.body=$('#noteBody').value;
  $('#saved').textContent='Saving…';updateWc();
  clearTimeout(saveTimer);saveTimer=setTimeout(()=>{persist();renderTabs()},400);
}
function newNote(){
  flush();const n={id:uid(),title:'',body:''};notes.push(n);activeId=n.id;
  renderNote();renderTabs();persist();$('#noteTitle').focus();
}
function insert(text){
  const t=$('#noteBody');if(t.disabled)return;
  const s=t.selectionStart,e=t.selectionEnd;
  t.value=t.value.slice(0,s)+text+t.value.slice(e);
  t.selectionStart=t.selectionEnd=s+text.length;t.focus();queueSave();
}
$('#noteTitle').oninput=queueSave;$('#noteBody').oninput=queueSave;
$('#newNote').onclick=newNote;
$('#search').oninput=renderTabs;
$('#stamp').onclick=()=>{
  const s=lesson.stages[Classroom.idx];
  const t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  insert(`[${t} · ${s.name}] `);
};
$('#check').onclick=()=>{
  const t=$('#noteBody');const needNl=t.value&&!t.value.endsWith('\n')?'\n':'';insert(needNl+'☐ ');
};
$('#noteBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ // continue checklist lines
    const t=e.target,pos=t.selectionStart,line=t.value.slice(t.value.lastIndexOf('\n',pos-1)+1,pos);
    if(line.startsWith('☐ ')||line.startsWith('☑ ')){
      if(line.trim().length<=1){e.preventDefault();const st=pos-line.length;t.value=t.value.slice(0,st)+t.value.slice(pos);t.selectionStart=t.selectionEnd=st;queueSave();return}
      e.preventDefault();insert('\n☐ ');
    }
  }
});
$('#noteBody').addEventListener('click',e=>{ // click a checkbox to toggle
  const t=e.target,pos=t.selectionStart,ls=t.value.lastIndexOf('\n',pos-1)+1;
  if(pos>ls&&pos<=ls+1&&'☐☑'.includes(t.value[ls])){
    t.value=t.value.slice(0,ls)+(t.value[ls]==='☐'?'☑':'☐')+t.value.slice(ls+1);
    t.selectionStart=t.selectionEnd=pos;queueSave();
  }
});
$('#del').onclick=()=>{
  const n=current();if(!n)return;
  if(!confirm(`Delete "${n.title||'Untitled'}"?`))return;
  const i=notes.indexOf(n);notes.splice(i,1);
  activeId=notes[Math.max(0,i-1)]?.id;renderNote();renderTabs();persist();
};
$('#export').onclick=()=>{
  flush();
  const md=notes.map(n=>`# ${n.title||'Untitled'}\n\n${n.body}\n`).join('\n---\n\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));
  a.download='classroom-notes-'+new Date().toISOString().slice(0,10)+'.md';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
window.addEventListener('beforeunload',flush);

/* ---------- Resizable split ---------- */
(function(){
  const sp=$('#splitter'),lay=$('#layout');
  const saved=store.get('classroom.nbw',null);if(saved)lay.style.setProperty('--nb-w',saved+'px');
  sp.addEventListener('pointerdown',e=>{
    sp.setPointerCapture(e.pointerId);
    const move=ev=>{
      const r=lay.getBoundingClientRect();
      const w=Math.max(300,Math.min(r.width*0.6,r.right-12-ev.clientX));
      lay.style.setProperty('--nb-w',w+'px');store.set('classroom.nbw',Math.round(w));
    };
    const up=()=>{sp.removeEventListener('pointermove',move);sp.removeEventListener('pointerup',up)};
    sp.addEventListener('pointermove',move);sp.addEventListener('pointerup',up);
  });
})();

/* ---------- Boot ---------- */
if(!current())activeId=notes[0]?.id;
renderNote();renderTabs();Classroom.go(0);
</script>
</body>
</html>
